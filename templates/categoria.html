<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ categoria }}</title>

    <style>

        body{
            margin:0;
            padding:20px;
            background:black;
            color:white;
            font-family:Arial, sans-serif;
            text-align:center;
        }

        .home{
            position: fixed;
            top: 20px;
            left: 25px;
            color: #E50914;
            text-decoration: none;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
            z-index: 1000;
        }

        .home:hover{
            color: white;
            transform: scale(1.05);
        }

        h1{
            font-size:60px;
            margin-top:20px;
            margin-bottom:40px;
        }

        .galeria{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:25px;
        }

        .video-card img{
            width:220px;
            height:390px;
            object-fit:cover;
            border-radius:15px;
            cursor:pointer;
            transition:0.3s;
        }

        .video-card img:hover{
            transform:scale(1.05);
            box-shadow:0 0 20px rgba(255,255,255,0.25);
        }

        a{
            text-decoration:none;
        }

    </style>
</head>
<body>

    <a href="/" class="home">
        TEA & TECHNOLOGY
    </a>

    <h1>{{ categoria }}</h1>

    <div class="galeria">

        {% for video in videos %}

        <div class="video-card">

            <a href="/video/{{ categoria }}/{{ video.nombre }}">

                <img
                    src="/static/thumbnails/{{ categoria }}/{{ video.thumb }}"
                    alt="{{ video.nombre }}"
                >

            </a>

        </div>

        {% endfor %}

    </div>

</body>
</html>
