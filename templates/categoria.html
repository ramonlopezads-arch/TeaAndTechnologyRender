<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ categoria }}</title>

    <style>
        body{
            margin:0;
            padding:20px;
            background:#000;
            color:#fff;
            font-family:Arial,sans-serif;
            text-align:center;
        }

        h1{
            margin-bottom:40px;
            font-size:60px;
        }

        .galeria{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:30px;
        }

        .video-card img{
            width:300px;
            height:475px;
            object-fit:cover;
            border-radius:18px;
            transition:.3s;
            cursor:pointer;
        }

        .video-card img:hover{
            transform:scale(1.05);
        }

        a{
            text-decoration:none;
        }
    </style>
</head>
<body>

    <h1>{{ categoria }}</h1>

    <div class="galeria">

        {% for video in videos %}

        <div class="video-card">

            <a href="/video/{{ categoria }}/{{ video.nombre }}">

                <img
                    src="/static/thumbnails/{{ categoria }}/{{ video.thumb }}"
                    alt="{{ video.nombre }}"
                >

            </a>

        </div>

        {% endfor %}

    </div>

</body>
</html>
