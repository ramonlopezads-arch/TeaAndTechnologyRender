<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ categoria }}</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#111;
            color:white;
            text-align:center;
            margin:0;
            padding:20px;
        }

        .galeria{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
        }

        .video-card img{
            width:220px;
            height:320px;
            object-fit:cover;
            border-radius:12px;
            cursor:pointer;
        }

        .video-card p{
            margin-top:8px;
        }

        a{
            color:white;
            text-decoration:none;
        }
    </style>
</head>
<body>

<h1>{{ categoria }}</h1>

<div class="galeria">

{% for video in videos %}
<div class="video-card">

    <a href="/video/{{ categoria }}/{{ video.nombre }}">

        <img
            src="/static/thumbnails/{{ categoria }}/{{ video.thumb }}"
            alt="{{ video.nombre }}"
        >

        <p>{{ video.nombre }}</p>

    </a>

</div>
{% endfor %}

</div>

</body>
</html>
