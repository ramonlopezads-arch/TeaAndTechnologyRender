<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ categoria }}</title>

    <style>

        body{
            margin:0;
            background:#000;
            color:white;
            font-family:Arial, sans-serif;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 40px;
        }

        .logo{
            color:#E50914;
            text-decoration:none;
            font-size:32px;
            font-weight:900;
            letter-spacing:2px;
        }

        .logo:hover{
            color:white;
        }

        .volver{
            color:white;
            text-decoration:none;
            font-size:22px;
        }

        .volver:hover{
            color:#E50914;
        }

        .contenedor-video{
            display:flex;
            justify-content:center;
            align-items:center;
            margin-top:20px;
        }

        video{
            width:65%;
            max-width:750px;
            max-height:75vh;
            border-radius:15px;
            box-shadow:0 0 25px rgba(255,255,255,0.15);
            background:black;
        }

        .navegacion{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:30px;
            margin-bottom:40px;
        }

        .btn{
            background:#E50914;
            color:white;
            text-decoration:none;
            padding:12px 25px;
            border-radius:8px;
            font-weight:bold;
            transition:.3s;
        }

        .btn:hover{
            background:#b20710;
            transform:scale(1.05);
        }

    </style>
</head>
<body>

    <div class="topbar">

        <a href="/" class="logo">
            TEA & TECHNOLOGY
        </a>

        <a href="/categoria/{{ categoria }}" class="volver">
            ← Volver
        </a>

    </div>

    <div class="contenedor-video">

        <video controls autoplay>
            <source src="{{ ruta_video }}" type="video/mp4">
            Tu navegador no soporta video.
        </video>

    </div>

    <div class="navegacion">

        <a
            class="btn"
            href="/video/{{ categoria }}/{{ anterior }}">
            ⬅ Anterior
        </a>

        <a
            class="btn"
            href="/video/{{ categoria }}/{{ siguiente }}">
            Siguiente ➡
        </a>

    </div>

</body>
</html>
